name: CI

on:
  push:
    branches: 
      - main  
    paths-ignore:
      - 'README.md'
      - 'helm/**'

jobs:      
    build:
        runs-on: ubuntu-latest
    
        steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Go 1.22.5
          uses: actions/setup-go@v2
          with:
            go-version: 1.22.5  

        - name: Build
          run: go build -o go-web-app
          
        - name: Run tests
          run: go test ./...
     
         
    code-quality:
        runs-on: ubuntu-latest
        needs: build

        steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Run golangci-lint
          uses: golangci/golangci-lint-action@v3
          with:
            version: v1.56.2


    Build-and-push-Docker-image:
        runs-on: ubuntu-latest
        needs: code-quality
        
        steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Log in to Docker Hub
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Build and push Docker image
          uses: docker/build-push-action@v3
          with:
            context: .
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/go-web-app:${{ github.run_id }}          
            
    update-new-tag-in-helm-chart:
        runs-on: ubuntu-latest
        needs: Build-and-push-Docker-image
        
        steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            token: ${{ secrets.TOKEN }}
            


        - name: Update Helm chart with new Docker image tag
          run: |
            NEW_TAG=${{ github.run_id }}
            sed -i "s/tag: .*/tag: ${NEW_TAG}/" helm/go-web-app-chart/values.yaml
            
            
        - name: Commit and push changes 
          run: |
            git config --global user.name "rupam-cx"
            git config --global user.email "rupam.das@codelogicx.com"
            git add helm/go-web-app-chart/values.yaml
            git commit -m "Update Helm chart with new Docker image tag: ${NEW_TAG}"
            git push origin main    
